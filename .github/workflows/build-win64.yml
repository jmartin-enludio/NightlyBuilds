name: build-win64

on:
  schedule:
    - cron: '0 8 * * *'  # Runs at 3:00AM EST every night
  workflow_dispatch:  # Allows manual trigger

jobs:
  build:
    runs-on: self-hosted   # Use your own machine/server

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Unreal Project
        shell: cmd
        run: |
          "C:\Program Files\Epic Games\UE_5.4\Engine\Build\BatchFiles\RunUAT.bat" BuildCookRun ^
            -project="${{ github.workspace }}\NightlyBuilds.uproject" ^
            -noP4 ^
            -platform=Win64 ^
            -clientconfig=Development ^
            -cook ^
            -allmaps ^
            -build ^
            -stage ^
            -pak ^
            -archive ^
            -archivedirectory="${{ github.workspace }}\Builds"

      - name: Get Date
        id: date
        run: echo "date=$(Get-Date -Format 'yyyyMMdd')" >> $env:GITHUB_OUTPUT
        shell: pwsh
        
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NightlyBuilds-Win64-Development-${{ steps.date.outputs.date }}-${{ github.run_number }}
          path: Builds/
          retention-days: 7
